<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="slider">
        <div class="slides">
            <img class="slides" src="assets/white.jpg">
            <img class="slides" src="assets/black.png">
            <img class="slides" src="assets/red.png">
            <img class="slides" src="assets/cian.png">
            <img class="slides" src="assets/yellow.png">
        </div>
    </div>
    <button class="prev" onclick="prevSlide()">&#10094</button>
    <button class="next" onclick="nextSlide()">&#10095</button>

    <script src="script.js"></script>
</body>
</html>
